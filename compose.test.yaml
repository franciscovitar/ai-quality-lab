name: ai-quality-lab-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aql_test
      POSTGRES_PASSWORD: aql_test_local_only
      POSTGRES_DB: ai_quality_test
    ports:
      - "127.0.0.1:55435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aql_test -d ai_quality_test"]
      interval: 3s
      timeout: 3s
      retries: 20

